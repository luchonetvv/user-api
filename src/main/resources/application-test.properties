spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

spring.datasource.generate-unique-name=true
spring.datasource.url=jdbc:h2:mem:userdbtest;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.h2.console.enabled=true

# ejecutar schema-test.sql y data-test.sql en tests
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql

security.jwt.token.secret-key=M3MoeUStUXM5cqgn1nLMybh9gE3GQwlo
# 30 dias para que expire
security.jwt.token.expiration=2592000000

app.regex.email=^[\\w._%+-]+@[\\w.-]+\\.[A-Za-z]{2,}$
app.regex.password=^(?=.*[A-Z])(?=.*\\d).{8,}$